<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雨夜コンビニ — Rainy Night Konbini Diorama</title>
<meta name="description" content="A rainy-night Japanese convenience store street corner, as a collectible miniature diorama — cel-shaded Three.js with planar wet-ground reflections.">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04060b; }
  body { cursor: grab; }
  body.dragging { cursor: grabbing; }
  canvas { display:block; width:100%; height:100%; outline:none; }

  /* 首帧之前的静默底色，避免白闪 */
  #boot {
    position: fixed; inset: 0; background: #04060b;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease; pointer-events: none; z-index: 10;
  }
  #boot.gone { opacity: 0; }
  #boot .wrap { text-align:center; }
  #boot .mark {
    font: 600 13px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .34em; color: #3d4b60; margin-bottom: 20px;
  }
  #boot .bar {
    width: 148px; height: 1px; margin: 0 auto;
    background: rgba(120,150,190,.16); overflow: hidden;
  }
  #boot .bar > i {
    display: block; width: 42%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(170,205,245,.85), transparent);
    animation: slide 1.7s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(340%); }
  }
  #boot .msg {
    margin-top: 16px;
    font: 10px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .18em; color: #2f3a4a;
  }
</style>
</head>
<body>
<div id="boot">
  <div class="wrap">
    <div class="mark">RAINY KONBINI</div>
    <div class="bar"><i></i></div>
    <div class="msg" id="bootMsg">LOADING</div>
  </div>
</div>

<!--
  用动态 import() 加载主模块，而不是 <script type="module" src>。

  原因：<script type="module"> 的依赖图解析会阻塞文档解析。当模块图较深
  （8 个 JS + 200KB 的 three.js）走 CDN 时，任何一个请求慢一拍，浏览器就
  会卡在 readyState="interactive"，脚本永远不执行，而且不会抛任何错误
  —— 页面上就是一片黑，控制台干净得像什么都没发生。

  动态 import() 不阻塞解析，还能 try/catch，失败了可以重试。
-->
<script type="module">
  const boot = document.getElementById('boot');
  const bootMsg = document.getElementById('bootMsg');
  const show = (msg) => { if (bootMsg) bootMsg.textContent = msg; };

  /* 并行预取：浏览器按 import 图串行发现依赖，深图会一轮轮等。
     先用 <link rel=modulepreload> 把整张图并行拉下来，import() 时
     就已经在缓存里了。 */
  const MODULES = [
    './src/main.js', './src/core.js', './src/base.js', './src/store.js',
    './src/props.js', './src/effects.js', './src/atmos.js', './src/batch.js',
    './src/life.js', './vendor/three.module.js',
    './vendor/OrbitControls.js', './vendor/BufferGeometryUtils.js',
  ];
  for (const href of MODULES) {
    const l = document.createElement('link');
    l.rel = 'modulepreload';
    l.href = href;
    document.head.appendChild(l);
  }

  async function load(attempt = 1) {
    try {
      await import('./src/main.js');
      if (boot) {
        boot.classList.add('gone');
        setTimeout(() => boot.remove(), 900);
      }
    } catch (e) {
      console.error('[konbini] load failed', attempt, e);
      if (attempt < 4) {
        show('RETRY ' + attempt + ' / 4');
        await new Promise(r => setTimeout(r, 700 * attempt));
        return load(attempt + 1);
      }
      show('LOAD FAILED — RELOAD');
    }
  }
  show('LOADING');
  load();
</script>
</body>
</html>
